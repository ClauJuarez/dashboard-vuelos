# This is a basic workflow to help you get started with Actions

name: Deploy flexdashboard to GitHub Pages

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: 
  contents: read
  pages: write 
  id-token: write 
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      
      - name: Checkout repository #clonar el repo
        uses: actions/checkout@v6 #

      - name: Setup R 
        uses: r-lib/actions/setup-r@v2

      - name: Setup Pandoc 
        uses: r-lib/actions/setup-pandoc@v2

      - name: Intall R packages
        run: |
          install.packages(c(
            "rmarkdown",
            "flexdashboard",
            "tidyverse",
            "nycflights13",
            "scales",
            "DT",
            "ggplot2",
            "plotly"
            ))
        shell: Rscript {0} 

      - name: Render dashboard
        run: | 
          rmarkdown::render(input = "02_dashboard_vuelos_alumnos.Rmd", output_file = "index.html" , output_dir = "_site")
        shell: Rscript {0}  

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
        
  deploy: #Job para publicar 
      environment: 
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}

      runs-on: ubuntu-latest

      needs: build # no puede empezar si no termina build correctamente

      steps: 

        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4




  
